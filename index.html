<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouHavePeople</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7fb;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --subtext: #555568;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141f;
      --card-bg: #1e1e2e;
      --text: #f2f2f7;
      --subtext: #b0b0c0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 1.5rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 3rem 2.5rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }

  h1 {
    font-size: 2rem;
    margin: 0 0 1rem;
  }

  p {
    color: var(--subtext);
    font-size: 1.05rem;
    line-height: 1.5;
    margin: 0 0 2rem;
  }

  button {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 0.85rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  button:hover {
    background: var(--accent-hover);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>YouHavePeople</h1>
    <p>Welcome! Learning starts here — explore courses, track your progress, and grow at your own pace.</p>
    <button type="button">Get Started</button>
  </div>
</body>
</html>
